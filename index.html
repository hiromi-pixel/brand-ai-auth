<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社内専用 型番照合付きAI真贋鑑定システム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const PASS = "1234";
    window.addEventListener('DOMContentLoaded', () => {
      const input = prompt("社内閲覧用パスワードを入力してください:");
      if (input !== PASS) {
        document.body.innerHTML = "<div class='flex h-screen items-center justify-center bg-gray-900 text-white text-xl'>アクセス権限がありません。</div>";
      }
    });
  </script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 sm:p-8">
  <div class="max-w-3xl mx-auto space-y-6">
    
    <header class="border-b border-gray-800 pb-4 text-center">
      <div class="inline-block bg-yellow-500/10 text-yellow-400 border border-yellow-500/30 text-xs px-3 py-1 rounded-full mb-2">Model & Serial Verification v5.0</div>
      <h1 class="text-3xl font-extrabold text-white tracking-wide">AI Brand Authenticator Pro</h1>
      <p class="text-sm text-gray-400 mt-1">型番・シリアル照合機能付き 鑑定ポータル</p>
    </header>

    <!-- 1. 基本情報＆型番入力 -->
    <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-2xl space-y-4">
      <h2 class="text-sm font-semibold text-gray-300">1. 商品基本情報・型番情報の入力</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1">ブランド選択</label>
          <select id="brandSelect" class="w-full bg-gray-950 border border-gray-800 text-sm rounded-xl p-3 text-gray-200 focus:outline-none focus:border-yellow-500">
            <option value="Louis Vuitton">ルイ・ヴィトン (Louis Vuitton)</option>
            <option value="CHANEL">シャネル (CHANEL)</option>
            <option value="HERMES">エルメス (HERMÈS)</option>
            <option value="ROLEX">ロレックス (ROLEX)</option>
            <option value="GUCCI">グッチ (GUCCI)</option>
            <option value="PRADA">プラダ (PRADA)</option>
            <option value="OTHER">その他ブランド</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">品目カテゴリ</label>
          <select id="categorySelect" onchange="switchCategoryUI()" class="w-full bg-gray-950 border border-gray-800 text-sm rounded-xl p-3 text-gray-200 focus:outline-none focus:border-yellow-500">
            <option value="bag">バッグ・財布</option>
            <option value="watch">腕時計</option>
            <option value="eyewear">サングラス・メガネ</option>
            <option value="apparel">服・アパレル</option>
            <option value="accessory">小物・アクセサリー</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">型番 / 品番 (Ref. / Model No.)</label>
          <input type="text" id="modelNumber" placeholder="例: M41526, 116610LN" class="w-full bg-gray-950 border border-gray-800 text-sm rounded-xl p-3 text-gray-200 focus:outline-none focus:border-yellow-500">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">シリアル / 製造番号 (Serial No.)</label>
          <input type="text" id="serialNumber" placeholder="例: FL0021, ランダムシリアル" class="w-full bg-gray-950 border border-gray-800 text-sm rounded-xl p-3 text-gray-200 focus:outline-none focus:border-yellow-500">
        </div>
      </div>
    </div>

    <!-- 2. 指定部位画像のアップロード -->
    <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-2xl space-y-4">
      <h2 class="text-sm font-semibold text-gray-300">2. 指定部位の写真アップロード</h2>
      
      <div id="uploadSlots" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>

      <button onclick="runGuidedAuth()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-gray-950 font-extrabold py-3.5 rounded-xl shadow-lg transition transform active:scale-95 mt-4">
        型番照合 & AI鑑定を実行する
      </button>
    </div>

    <div id="loading" class="hidden bg-gray-900 p-8 rounded-2xl border border-gray-800 text-center space-y-4">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-yellow-500 border-t-transparent"></div>
      <p class="text-yellow-400 text-sm font-semibold">型番フォーマット照合 & 画像エッジ多角解析中...</p>
    </div>

    <div id="result" class="hidden bg-gray-900 p-6 rounded-2xl border border-gray-800 space-y-6">
      <div class="flex items-center justify-between border-b border-gray-800 pb-4">
        <div>
          <span class="text-xs text-gray-400 uppercase tracking-wider block">総合判定</span>
          <div id="judgmentTitle" class="text-2xl font-black mt-1"></div>
        </div>
        <div class="text-right">
          <span class="text-xs text-gray-400 uppercase tracking-wider block">AI一致率スコア</span>
          <div id="scoreText" class="text-4xl font-black mt-1"></div>
        </div>
      </div>

      <div id="alertBox" class="p-4 rounded-xl border text-sm leading-relaxed"></div>

      <div>
        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">項目別照合結果</h3>
        <div id="detailsList" class="space-y-2"></div>
      </div>
    </div>

  </div>

  <script>
    const slotsMap = {
      bag: [
        { id: "img_overall", label: "① 全体写真 (型崩れ・柄)" },
        { id: "img_logo", label: "② ブランドロゴ刻印 (接写)" },
        { id: "img_serial", label: "③ シリアル・型番印字" },
        { id: "img_hardware", label: "④ 金具・ビス・ファスナー" }
      ],
      watch: [
        { id: "img_dial", label: "① 文字盤全体 (インデックス)" },
        { id: "img_back", label: "② 裏蓋刻印・シリアル" },
        { id: "img_crown", label: "③ リューズ・ロゴ刻印" },
        { id: "img_clasp", label: "④ ブレス・バックル刻印" }
      ],
      eyewear: [
        { id: "img_frame", label: "① 全体・フレーム構造" },
        { id: "img_temple", label: "② ツル内側ロゴ・型番刻印" },
        { id: "img_lens", label: "③ レンズ刻印・透かしマーク" },
        { id: "img_hinge", label: "④ ヒンジ (蝶番) ・金具部" }
      ],
      apparel: [
        { id: "img_full", label: "① 全体写真 (シルエット・縫製)" },
        { id: "img_brand_tag", label: "② 首元/ウエスト ブランドタグ" },
        { id: "img_wash_tag", label: "③ 内側 品質表示・洗濯タグ" },
        { id: "img_detail", label: "④ ボタン/ジップ/刺繍拡大" }
      ],
      accessory: [
        { id: "img_acc_full", label: "① 全体写真・表面仕上げ" },
        { id: "img_acc_stamp", label: "② ブランド刻印・ロゴ印字" },
        { id: "img_metal_stamp", label: "③ 素材刻印 (K18/925/ホールマーク)" },
        { id: "img_clasp_part", label: "④ 金具・留め具・フック部" }
      ]
    };

    function switchCategoryUI() {
      const cat = document.getElementById('categorySelect').value;
      const slots = slotsMap[cat];
      const container = document.getElementById('uploadSlots');
      
      container.innerHTML = slots.map(s => `
        <div class="bg-gray-950 p-3 rounded-xl border border-gray-800 space-y-2">
          <label class="block text-xs font-bold text-yellow-500">${s.label}</label>
          <input type="file" id="${s.id}" accept="image/*" class="block w-full text-xs text-gray-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-gray-800 file:text-gray-200 hover:file:bg-gray-700 cursor-pointer">
        </div>
      `).join('');
    }

    window.addEventListener('DOMContentLoaded', switchCategoryUI);

    async function runGuidedAuth() {
      const brand = document.getElementById('brandSelect').value;
      const category = document.getElementById('categorySelect').value;
      const modelNumber = document.getElementById('modelNumber').value;
      const serialNumber = document.getElementById('serialNumber').value;

      const slots = slotsMap[category];
      const files = [];

      for (let s of slots) {
        const input = document.getElementById(s.id);
        if (input.files[0]) {
          files.push(input.files[0]);
        }
      }

      if (files.length < 1) {
        alert("鑑定を行う画像を1枚以上アップロードしてください。");
        return;
      }

      document.getElementById('result').classList.add('hidden');
      document.getElementById('loading').classList.remove('hidden');

      const formData = new FormData();
      formData.append('brand', brand);
      formData.append('category', category);
      formData.append('model_number', modelNumber);
      formData.append('serial_number', serialNumber);

      for (let f of files) {
        formData.append('files', f);
      }

      try {
        const response = await fetch('https://brand-ai-backend-cs53.onrender.com/api/v1/authenticate', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) throw new Error("AIサーバーの通信に失敗しました。");

        const data = await response.json();

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('result').classList.remove('hidden');

        document.getElementById('scoreText').innerText = `${data.overall_score}%`;
        
        const judgmentTitle = document.getElementById('judgmentTitle');
        const alertBox = document.getElementById('alertBox');
        const scoreText = document.getElementById('scoreText');

        if (data.status_code === 'PASS') {
          judgmentTitle.innerText = `【 ${data.judgment} 】`;
          judgmentTitle.className = "text-2xl font-black text-emerald-400";
          scoreText.className = "text-4xl font-black text-emerald-400";
          alertBox.className = "p-4 rounded-xl border border-emerald-500/30 bg-emerald-500/10 text-emerald-300 text-sm";
        } else if (data.status_code === 'REVIEW') {
          judgmentTitle.innerText = `【 ${data.judgment} 】`;
          judgmentTitle.className = "text-2xl font-black text-amber-400";
          scoreText.className = "text-4xl font-black text-amber-400";
          alertBox.className = "p-4 rounded-xl border border-amber-500/30 bg-amber-500/10 text-amber-300 text-sm";
        } else {
          judgmentTitle.innerText = `【 ${data.judgment} 】`;
          judgmentTitle.className = "text-2xl font-black text-rose-500";
          scoreText.className = "text-4xl font-black text-rose-500";
          alertBox.className = "p-4 rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-300 text-sm";
        }

        alertBox.innerText = data.message;

        const detailsList = document.getElementById('detailsList');
        detailsList.innerHTML = data.details.map(item => `
          <div class="flex items-center justify-between p-3 rounded-lg bg-gray-950/60 border border-gray-800 text-sm">
            <span class="text-gray-300">${item.name}</span>
            <span class="${item.pass ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold'}">
              ${item.pass ? '✓ 正常 (一致)' : '✕ 不一致 / 異変あり'}
            </span>
          </div>
        `).join('');

      } catch (err) {
        alert(err.message);
        document.getElementById('loading').classList.add('hidden');
      }
    }
  </script>
</body>
</html>
